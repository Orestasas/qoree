<!--
  qoree @@VERSION@@ · a self-custodial Qubic wallet in one HTML file
  Not independently audited. Keep a written backup of every seed.

  WHAT IT DOES
    Seeds are made, kept and used only in this page. Signing uses the official Qubic TypeScript SDK, and each
    transfer is decoded and checked against what you confirmed before it is sent. The wallet lives in this tab's
    memory unless you save it, encrypted with your password (Argon2id, then AES-256-GCM). A transfer shows as
    done only once the network archive confirms it.

  HOSTING IT
    Serve this file alone, as index.html, over HTTPS from an address used for nothing else: any other page
    served there could read the saved wallet. Publish each release's SHA-256, and send these headers:
        Content-Security-Policy: frame-ancestors 'none'
        Strict-Transport-Security: max-age=31536000
        X-Content-Type-Options: nosniff
        Referrer-Policy: no-referrer
        Cross-Origin-Opener-Policy: same-origin
        Cache-Control: no-cache
    On your own computer, serve its folder on 127.0.0.1 only:
        python3 -m http.server <port> --bind 127.0.0.1 --directory <folder>

  NETWORK (the Content-Security-Policy below blocks every other host)
    rpc.qubic.org        balances, history, broadcasting, price
    api.coingecko.com    prices, charts, 24h change
    api.gateio.ws        older prices, order books, exchange status
    api.mexc.com         order books
    static.qubic.org     contract and exchange names
    annexplorer.jetskipool.ai  BPP-9000's Bitcoin calls
    Everything but rpc.qubic.org can be turned off in Settings → Network & data; order books and BPP-9000
    are off until you turn them on. Only addresses and signed transactions are sent: seeds, keys and passwords never are.

  LIMITS
    A software wallet, not an isolated signer: a browser extension allowed on this page can read seeds, so
    use a browser profile without extensions for funds. No asset transfers, contract calls or hardware
    wallets yet.

  BUILD
    Built from src/ with ./build.sh, which pins this page's script and styles in its CSP: edit the source,
    not this file. The full notes (security model, hosting details) are in the project's docs/SECURITY.md.
    Embedded unmodified, with their licences at the start of the script: the Qubic TypeScript SDK (Qubic
    Anti-Military License), @noble/hashes and Project Nayuki's QR Code generator (MIT). Fonts: Geist and
    Geist Mono (SIL Open Font License 1.1). Exchange logos are their owners' trademarks.
-->
